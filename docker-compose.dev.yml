name: socialmesh-dev

services:
    mailpit:
        image: axllent/mailpit:latest
        pull_policy: missing
        container_name: socialmesh-dev-mail
        restart: unless-stopped
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - dev

    app:
        image: socialmesh:local
        pull_policy: never
        container_name: socialmesh-dev-app
        env_file:
            - .env
        environment:
            APP_NAME: "${APP_NAME:-SocialMesh}"
            APP_ENV: "${APP_ENV:-local}"
            APP_DEBUG: "${APP_DEBUG:-true}"
            APP_URL: "${DOCKER_APP_URL:-http://localhost:8082}"
            AUTORUN_ENABLED: "false"
            PHP_OPCACHE_ENABLE: "0"
            OCTANE_SERVER: frankenphp
            SSL_MODE: off
            DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
            DB_DATABASE: "${DB_DATABASE:-/var/www/html/database/sqlite/database.sqlite}"
            CACHE_STORE: "${CACHE_STORE:-database}"
            QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
            QUEUE_WORKER_COUNT: "${QUEUE_WORKER_COUNT:-1}"
            SESSION_DRIVER: "${SESSION_DRIVER:-database}"
            MAIL_MAILER: "${DOCKER_MAIL_MAILER:-smtp}"
            MAIL_HOST: "${DOCKER_MAIL_HOST:-mailpit}"
            MAIL_PORT: "${DOCKER_MAIL_PORT:-1025}"
            MAIL_USERNAME: "${DOCKER_MAIL_USERNAME:-null}"
            MAIL_PASSWORD: "${DOCKER_MAIL_PASSWORD:-null}"
            MAIL_SCHEME: "${DOCKER_MAIL_SCHEME:-null}"
            MAIL_FROM_ADDRESS: "${DOCKER_MAIL_FROM_ADDRESS:-hello@socialmesh.local}"
            MAIL_FROM_NAME: "${DOCKER_MAIL_FROM_NAME:-SocialMesh}"
            QUEUE_WORKER_ENABLED: "${QUEUE_WORKER_ENABLED:-true}"
            SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
            INERTIA_SSR_ENABLED: "${INERTIA_SSR_ENABLED:-false}"
            INERTIA_SSR_URL: "${INERTIA_SSR_URL:-http://127.0.0.1:13714}"
            DIRECT_MESSAGES_ENABLED: "${DIRECT_MESSAGES_ENABLED:-false}"
        depends_on:
            - mailpit
        ports:
            - "${APP_PORT:-8082}:8080"
        volumes:
            - .:/var/www/html:cached
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - sqlite:/var/www/html/database/sqlite
            - bootstrap-cache:/var/www/html/bootstrap/cache
        command: >
            /bin/bash -lc "
            composer install --no-interaction &&
            php artisan package:discover --ansi &&
            php artisan migrate --force --no-interaction &&
            php artisan db:seed --class=DefaultUserSeeder --force --no-interaction &&
            exec supervisord -c /etc/supervisor/laravel.conf
            "
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
            start_period: 20s
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - dev

    vite:
        image: socialmesh:local
        pull_policy: never
        container_name: socialmesh-dev-vite
        user: "${USERID:-1000}:${GROUPID:-1000}"
        working_dir: /var/www/html
        entrypoint: []
        env_file:
            - .env
        environment:
            VITE_HOST: "${VITE_HOST:-0.0.0.0}"
            VITE_PORT: "${VITE_PORT:-5173}"
            VITE_HMR_HOST: "${VITE_HMR_HOST:-localhost}"
        depends_on:
            - app
        ports:
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
        healthcheck:
            disable: true
        volumes:
            - .:/var/www/html:cached
            - vendor:/var/www/html/vendor
            - storage:/var/www/html/storage
            - sqlite:/var/www/html/database/sqlite
            - bootstrap-cache:/var/www/html/bootstrap/cache
        command: >
            /bin/bash -lc "
            if [ ! -f public/frankenphp-worker.php ]; then cp vendor/laravel/octane/src/Commands/stubs/frankenphp-worker.php public/frankenphp-worker.php; fi &&
            bun install --frozen-lockfile &&
            if [ ! -L public/storage ] && [ ! -e public/storage ]; then ln -s ../storage/app/public public/storage; fi &&
            exec bun run dev -- --host $${VITE_HOST} --port $${VITE_PORT}
            "
        networks:
            - dev

networks:
    dev:
        name: socialmesh-dev
        driver: bridge

volumes:
    vendor:
        name: socialmesh-dev-vendor
    storage:
        name: socialmesh-dev-storage
    sqlite:
        name: socialmesh-dev-sqlite
    bootstrap-cache:
        name: socialmesh-dev-bootstrap-cache
